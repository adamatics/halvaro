id: err29-blocked-projects-horizon-not-whole
rule: horizon_days that is not a whole number is refused.
function: blocked_projects
frames:
  reservations_open:
  - prj_key: PRJ-900001
    itm_key: ITM-900001
    site_key: SITE-900001
    qty_open: 1
    needed_by_date: '2031-03-01'
  stock:
  - site_key: SITE-900001
    itm_key: ITM-900001
    on_hand: 0
args:
  as_of: '2031-02-01'
  items:
  - ITM-900001
  active:
  - PRJ-900001
  horizon_days: soon
raises:
  error: FrameError
  message: horizon_days must be a whole number of days from zero to 36500, not 'soon'
  names:
  - horizon_days
  - '36500'
