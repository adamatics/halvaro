id: err02-clauses-on-as-of-number
rule: The day argument as_of is a number, not a date or ISO text, so the function refuses it.
function: clauses_on
frames:
  clause:
  - con_key: CON-900001
    clause_no: 1
    clause_type: 1
    valid_from: '2031-01-05'
    valid_to: '2031-01-05'
args:
  as_of: 7
raises:
  error: FrameError
  message: as_of 7 is a number, not a date
  names:
  - as_of
  - '7'
