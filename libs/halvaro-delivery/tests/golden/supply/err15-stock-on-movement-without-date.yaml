id: err15-stock-on-movement-without-date
rule: A movement without a movement_date is refused.
function: stock_on
frames:
  stock_movement:
  - site_key: SITE-900001
    itm_key: ITM-900001
    movement_date: null
    movement_type: receipt
    qty: 5
    prj_key: null
    reservation_no: null
args:
  as_of: '2031-02-01'
raises:
  error: FrameError
  message: inventory.stock_movement has rows without movement_date
  names:
  - stock_movement
  - movement_date
