id: err15-price-gaps-window-ends-before-it-starts
rule: A window that ends before it starts is refused.
function: price_gaps
frames:
  price_list:
  - sup_key: SUP-900001
    itm_key: ITM-900001
    valid_from: '2031-01-05'
    valid_to: null
    unit_price: 1
    currency: EUR
    con_key: CON-900001
    change_reason: 1
args:
  window:
  - '2031-02-01'
  - '2031-01-01'
raises:
  error: FrameError
  message: window ends before it starts
  names:
  - window
  - ends before it starts
