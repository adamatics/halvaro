id: err34-experience-network-unknown-project
rule: A project of the list that is not in the project frame is refused.
function: experience_network
frames:
  project_role:
  - prj_key: PRJ-900001
    emp_key: EMP-900001
    project_role: engineer
    start: '2031-01-05'
    end: '2031-03-01'
    hours_total: 10
    basis: time_entry
  project:
  - prj_key: PRJ-900001
    type: dh_network
    soil_class: clay
    country: DE
    legacy: false
args:
  prj_keys:
  - PRJ-900002
  as_of: '2031-02-01'
raises:
  error: FrameError
  message: 1 projects of the list are not in the project frame (for example PRJ-900002)
  names:
  - PRJ-900002
  - project frame
