id: err37-cause-shares-null-cause
rule: A delay event without a cause_code is refused, with the column named.
function: cause_shares
frames:
  delay_event:
  - prj_key: PRJ-900001
    cause_code: null
    responsible_party: customer
    days: 1
    mtg_key: MTG-900001
  project:
  - prj_key: PRJ-900001
    data_depth: full
args: {}
raises:
  error: FrameError
  message: projects.delay_event has rows with a null cause_code; they would drop out of the shares
  names:
  - delay_event
  - cause_code
