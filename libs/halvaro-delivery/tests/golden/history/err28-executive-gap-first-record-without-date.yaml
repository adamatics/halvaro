id: err28-executive-gap-first-record-without-date
rule: A first record without a diary_date is refused.
function: executive_gap
frames:
  first:
  - prj_key: PRJ-900001
    diary_date: null
  exec_attendance:
  - mtg_key: MTG-900001
    prj_key: PRJ-900001
    date: '2031-01-05'
    emp_key: EMP-900001
    role_name: director
args:
  prj_key: PRJ-900001
raises:
  error: FrameError
  message: the first record of PRJ-900001 has no diary_date
  names:
  - PRJ-900001
  - diary_date
