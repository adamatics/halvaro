id: err41-supplier-performance-recompute-identical-receipts
rule: 'Identical goods receipt rows without a receipt_no are refused: a quantity would count twice.'
function: supplier_performance_recompute
frames:
  po_line:
  - po_key: PO-900001
    line_no: 1
    itm_key: ITM-900001
    qty: 5
    promised_date: '2031-02-01'
    requested_date: '2031-01-20'
  purchase_order:
  - po_key: PO-900001
    sup_key: SUP-900001
    prj_key: PRJ-900001
    order_date: '2031-01-05'
    status: open
  goods_receipt:
  - po_key: PO-900001
    line_no: 1
    receipt_date: '2031-01-20'
    qty_accepted: 1
  - po_key: PO-900001
    line_no: 1
    receipt_date: '2031-01-20'
    qty_accepted: 1
args:
  as_of: '2031-02-01'
raises:
  error: FrameError
  message: procurement.goods_receipt has identical rows and no receipt_no to tell them apart; a repeated row would count its quantity twice
  names:
  - goods_receipt
  - receipt_no
