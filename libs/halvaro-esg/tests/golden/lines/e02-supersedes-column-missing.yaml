id: e02-supersedes-column-missing
rule: "current_basis is refused when the line frame lacks supersedes_line_no, which the restatement links need."
function: current_basis
frames:
  L: [{"le_key": "LE-900001", "period": "2030-05", "scope": 1, "category": "fuel", "line_no": 1, "kgco2e": 10.0, "quantity": 5.0, "efac_key": "EF-900001", "method": null, "ghg_category": "1", "restated_from_period": null, "is_superseded": false}]
raises:
  error: FrameError
  message: "energy-esg.emission_line frame lacks column(s) supersedes_line_no; load the source columns without renaming them"
  names: ["supersedes_line_no", "energy-esg.emission_line"]
