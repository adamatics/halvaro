# Golden error case of halvaro-hr.data_now: the message is the golden text (tests/test_golden_errors.py); change it only on purpose.
function: data_now
why: as_of is after the data release date
args:
- hr:
    frame:
      columns:
      - release
      - now
      - generated_at
      - base_seed
      - increment
      rows:
      - - r1
        - '2026-03-31'
        - '2026-04-01'
        - 1
        - 0
- 2026-04-30
raises: PeriodError
message: 'as_of 2026-04-30 is after the data release date 2026-03-31: holiday ledgers and status caches end there. Use a date up to 2026-03-31.'
