# Type check of halvaro-delivery (standard 3.1): every module of the package, strict where it counts. Run: python -m mypy --config-file mypy-lib.ini
# The options are those of halvaro-hr (mypy-holiday.ini); here the whole package is the typed part from the start, so the list never has to grow.
[mypy]
files = src/halvaro/delivery
mypy_path = src:../halvaro-core/src
namespace_packages = True
explicit_package_bases = True
python_version = 3.10
follow_imports = silent
disallow_untyped_defs = True
disallow_incomplete_defs = True
disallow_any_generics = True
no_implicit_optional = True
warn_return_any = True
warn_unused_ignores = True
warn_redundant_casts = True
show_error_codes = True

# The build output of setuptools-scm does not exist in a checkout (git-ignored); _version.py falls back when it is absent.
[mypy-halvaro.delivery._version_scm]
ignore_missing_imports = True
