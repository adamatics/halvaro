id: err06-blocked-projects-as-of-number
rule: The day argument as_of is a number, not a date or ISO text, so the function refuses it.
function: blocked_projects
frames:
  reservations_open:
  - prj_key: PRJ-900001
    itm_key: ITM-900001
    site_key: SIT-900001
    qty_open: 1
    needed_by_date: '2031-01-05'
  stock:
  - site_key: SIT-900001
    itm_key: ITM-900001
    on_hand: 1
args:
  as_of: 7
  items:
  - ITM-900001
  active:
  - PRJ-900001
raises:
  error: FrameError
  message: as_of 7 is a number, not a date
  names:
  - as_of
  - '7'
