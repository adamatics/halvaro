id: err02-tender-profile-unknown-key
rule: The opp_key asked for is not an opportunity of the frame.
function: tender_profile
frames:
  opportunity:
  - opp_key: OPP-900002
    cus_key: CUS-900001
    project_type: 1
    country: 1
    soil_class: 1
    route_length_m: 1
    bid_deadline: '2031-01-05'
args:
  opp_key: OPP-900001
raises:
  error: FrameError
  message: opportunity OPP-900001 is not in crm.opportunity
  names:
  - opportunity
  - OPP-900001
