id: err24-attendance-names-unknown-meeting
rule: An attendance row that names a meeting that is not in projects.meeting is refused.
function: attendance
frames:
  meeting:
  - mtg_key: MTG-900001
    prj_key: PRJ-900001
    date: '2031-01-05'
    meeting_type: 1
  meeting_attendance:
  - mtg_key: MTG-900002
    attendee_type: employee
    emp_key: EMP-900001
    cnt_key: null
    status: present
    role_in_meeting: 1
args: {}
raises:
  error: FrameError
  message: 1 attendance rows name a meeting that is not in projects.meeting (for example MTG-900002)
  names:
  - MTG-900002
  - projects.meeting
