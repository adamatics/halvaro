id: err16-attendance-meeting-not-a-frame
rule: The meeting argument is not a DataFrame.
function: attendance
frames:
  meeting:
  - mtg_key: MTG-900001
    prj_key: PRJ-900001
    date: '2031-01-05'
    meeting_type: 1
  meeting_attendance:
  - mtg_key: MTG-900001
    attendee_type: employee
    emp_key: EMP-900001
    cnt_key: null
    status: present
    role_in_meeting: 1
args:
  meeting: x
raises:
  error: FrameError
  message: projects.meeting must be a DataFrame, not str
  names:
  - projects.meeting
  - str
