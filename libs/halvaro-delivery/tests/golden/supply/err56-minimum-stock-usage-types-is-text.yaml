id: err56-minimum-stock-usage-types-is-text
rule: usage_types given as one text instead of a tuple is refused.
function: minimum_stock
frames:
  stock_movement:
  - site_key: SITE-900001
    itm_key: ITM-900001
    movement_date: '2031-01-05'
    movement_type: issue_project
    qty: -2
    prj_key: null
    reservation_no: null
  lead_time:
  - sup_key: SUP-900001
    itm_key: ITM-900001
    valid_from: '2031-01-01'
    valid_to: null
    lead_time_weeks: 4
  item:
  - itm_key: ITM-900001
    stocked: true
    preferred_sup_key: SUP-900001
args:
  as_of: '2031-02-01'
  usage_types: issue_project
raises:
  error: FrameError
  message: usage_types must be a tuple of movement types
  names:
  - usage_types
  - tuple
