id: err27-spot-orders-two-framework-rows
rule: Two framework price rows for one item and start date are refused, with the supplier and item named.
function: spot_orders
frames:
  po_line:
  - po_key: PO-900001
    line_no: 1
    itm_key: ITM-900001
    unit_price: 1
    currency: EUR
    price_source: spot
    expedite: false
  purchase_order:
  - po_key: PO-900001
    order_type: spot
    sup_key: SUP-900001
    prj_key: PRJ-900001
    order_date: '2031-01-05'
  price_list:
  - sup_key: SUP-900002
    itm_key: ITM-900001
    valid_from: '2031-01-01'
    valid_to: null
    unit_price: 1
    currency: EUR
    change_reason: 1
  - sup_key: SUP-900002
    itm_key: ITM-900001
    valid_from: '2031-01-01'
    valid_to: null
    unit_price: 1
    currency: EUR
    change_reason: 1
args:
  framework_sup_key: SUP-900002
  rates:
    EUR: 7.5
raises:
  error: FrameError
  message: procurement.price_list has more than one framework row for SUP-900002, ITM-900001 valid from 2031-01-01; the price on a date is not defined
  names:
  - SUP-900002
  - ITM-900001
