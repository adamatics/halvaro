id: err19-attendance-unknown-status
rule: A status other than present, apology or absent is refused, with the value named.
function: attendance
frames:
  meeting:
  - mtg_key: MTG-900001
    prj_key: PRJ-900001
    date: '2031-01-05'
    meeting_type: 1
  meeting_attendance:
  - mtg_key: MTG-900001
    attendee_type: employee
    emp_key: EMP-900001
    cnt_key: null
    status: maybe
    role_in_meeting: 1
args: {}
raises:
  error: FrameError
  message: 'projects.meeting_attendance.status has unknown value [''maybe'']; known: present, apology, absent (only present counts as attendance)'
  names:
  - status
  - maybe
