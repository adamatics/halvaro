id: err11-price-list-on-price-missing
rule: A valid price row without a unit_price is refused, with the supplier and item named.
function: price_list_on
frames:
  price_list:
  - sup_key: SUP-900001
    itm_key: ITM-900001
    valid_from: '2031-01-05'
    valid_to: null
    unit_price: .nan
    currency: EUR
    con_key: CON-900001
    change_reason: 1
args:
  as_of: '2031-02-01'
raises:
  error: FrameError
  message: procurement.price_list has no unit_price for SUP-900001, ITM-900001 (valid from 2031-01-05) on 2031-02-01
  names:
  - SUP-900001
  - ITM-900001
