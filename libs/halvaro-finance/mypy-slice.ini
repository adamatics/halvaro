# Type check of the slice of the standard (cash.py, vat_tax.py, reconcile.py; PG-15, issue #201, lane V). Run: python -m mypy --config-file mypy-slice.ini
# Every other module is read for its types (follow_imports = silent) and is not reported; widening the list of files is a later step.
[mypy]
cache_dir = .mypy_cache/slice
files = src/halvaro/finance/cash.py, src/halvaro/finance/vat_tax.py, src/halvaro/finance/reconcile.py, src/halvaro/finance/subledgers.py
mypy_path = src:../halvaro-core/src
namespace_packages = True
explicit_package_bases = True
python_version = 3.10
follow_imports = silent
disallow_untyped_defs = True
disallow_incomplete_defs = True
disallow_any_generics = True
no_implicit_optional = True
warn_return_any = True
warn_unused_ignores = True
warn_redundant_casts = True
show_error_codes = True
