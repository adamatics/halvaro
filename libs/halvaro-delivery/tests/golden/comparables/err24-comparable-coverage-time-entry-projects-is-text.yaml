id: err24-comparable-coverage-time-entry-projects-is-text
rule: time_entry_projects given as one text is refused.
function: comparable_coverage
frames:
  comparable: &id001
  - prj_key: PRJ-900001
  project:
  - prj_key: PRJ-900001
    final_cost: 1
    route_length_m: 1
  estimate_version:
  - prj_key: PRJ-900001
    type: final
  project_role: *id001
args:
  time_entry_projects: PRJ-900001
raises:
  error: FrameError
  message: time_entry_projects is a list of prj_key values or the projects.time_entry frame (a Series or a groupby is refused; pass .unique() or the frame)
  names:
  - time_entry_projects
