id: err08-elements-per-spare-unit-as-of-number
rule: The day argument as_of is a number, not a date or ISO text, so the function refuses it.
function: elements_per_spare_unit
frames:
  stock:
  - site_key: SIT-900001
    itm_key: ITM-900001
    on_hand: 1
  grid_element:
  - element_type: 1
    status: 1
    zone_key: ZON-900001
args:
  items:
  - ITM-900001
  site: SIT-900001
  as_of: 7
raises:
  error: FrameError
  message: as_of 7 is a number, not a date
  names:
  - as_of
  - '7'
