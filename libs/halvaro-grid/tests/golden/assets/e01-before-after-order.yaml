id: e01-before-after-order
rule: A before date that lies after the after date is refused, because a trend compares an earlier state with a later one.
function: condition_trend
frames:
  condition_assessment:
  - net_key: NET-900001
    assessed_on: '2031-02-01'
    score: 3.0
  grid_element:
  - net_key: NET-900001
    condition_score: 3.0
    element_type: cable
    status: in_service
    install_year: 2005
    condition_class: C
    cus_key: CUS-900001
    zone_key: ZONE-0001
    commissioned_date: '2005-06-01'
args:
  group:
  - NET-900001
  before: '2031-06-01'
  after: '2031-01-01'
raises:
  error: FrameError
  message: 'before and after are dates with before not after after (got before ''2031-06-01'', after ''2031-01-01'')'
  names:
  - before
  - after
