id: e01-horizon-days-negative
rule: A negative horizon is refused, because the look-ahead counts days from the as-of date forward.
function: due_within
frames:
  maintenance_plan:
    rows:
    - net_key: NET-900001
      plan_no: 1
      plan_type: condition_inspection
      next_due: '2031-02-01'
      last_done: '2030-02-01'
      team_key: TEAM-900001
      status: active
      interval_months: 54
      valid_from: '2031-01-01'
    dates:
    - next_due
    - last_done
args:
  as_of: '2031-06-01'
  horizon_days: -3
raises:
  error: FrameError
  message: 'horizon_days must be a whole number of days, zero or more (got -3)'
  names:
  - horizon_days
  - zero or more
