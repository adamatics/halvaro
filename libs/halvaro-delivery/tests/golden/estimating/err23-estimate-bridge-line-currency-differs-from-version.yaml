id: err23-estimate-bridge-line-currency-differs-from-version
rule: 'An estimate line in another currency than its version is refused: no conversion is made.'
function: estimate_bridge
frames:
  estimate_version:
  - prj_key: PRJ-900001
    estimate_version: 1
    type: tender
    date: '2031-01-05'
    currency: EUR
    total_cost: 1
  estimate_line:
  - prj_key: PRJ-900001
    estimate_version: 1
    cst_key: CST-900001
    amount: 1
    currency: DKK
  cost_code:
  - cst_key: CST-900001
    category: civil
args: {}
raises:
  error: FrameError
  message: an estimate line of PRJ-900001 is in DKK, its version in EUR; no conversion is made
  names:
  - PRJ-900001
  - DKK
  - EUR
