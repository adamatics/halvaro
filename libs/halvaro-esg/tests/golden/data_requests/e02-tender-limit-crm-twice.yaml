id: e02-tender-limit-crm-twice
rule: "tender_limit is refused when the customer_carbon_limit frame holds an opportunity twice."
function: tender_limit
frames:
  R: [{"cus_key": "CUS-900001", "request_no": 1, "request_type": "tender_requirement", "opp_key": "OPP-900001", "limit_kgco2e_per_m": 20.0, "received": "2031-03-01", "due": "2031-03-31", "answered_date": null}]
  CL: [{"opp_key": "OPP-900001", "limit_kgco2e_per_m": 20.0}, {"opp_key": "OPP-900001", "limit_kgco2e_per_m": 25.0}]
raises:
  error: FrameError
  message: "the customer_carbon_limit frame has more than one row for an opportunity"
  names: ["customer_carbon_limit", "opportunity"]
