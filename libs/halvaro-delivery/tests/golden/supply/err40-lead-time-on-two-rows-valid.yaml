id: err40-lead-time-on-two-rows-valid
rule: Two lead time rows valid on the date for one supplier and item are refused.
function: lead_time_on
frames:
  lead_time:
  - sup_key: SUP-900001
    itm_key: ITM-900001
    valid_from: '2031-01-01'
    valid_to: null
    lead_time_weeks: 4
  - sup_key: SUP-900001
    itm_key: ITM-900001
    valid_from: '2031-01-02'
    valid_to: null
    lead_time_weeks: 4
args:
  as_of: '2031-02-01'
raises:
  error: FrameError
  message: two lead time rows are valid on the date for SUP-900001 ITM-900001
  names:
  - two lead time rows
  - SUP-900001
