id: e07-factor-twice
rule: "validate_lines is refused when the factor table holds one efac_key twice."
function: validate_lines
frames:
  L: [{"le_key": "LE-900001", "period": "2030-05", "scope": 1, "category": "fuel", "line_no": 1, "kgco2e": 10.0, "quantity": 5.0, "efac_key": "EF-900001", "method": null, "ghg_category": "1", "restated_from_period": null, "supersedes_line_no": null, "is_superseded": false, "ref_type": "MTR", "ref_key": "MTR-900001"}]
  F: [{"efac_key": "EF-900001", "kgco2e_per_unit": 2.0, "valid_from": "2030-01-01", "valid_to": null}, {"efac_key": "EF-900001", "kgco2e_per_unit": 3.0, "valid_from": "2031-01-01", "valid_to": null}]
raises:
  error: FrameError
  message: "energy-esg.emission_factor has more than one row for an efac_key"
  names: ["efac_key", "more than one row"]
