id: err17-contracts-for-project-parent-chain-loops
rule: A parent chain that returns to a contract already seen is refused.
function: contracts_for_project
frames:
  project:
  - prj_key: PRJ-900001
    contract_key: CON-900001
  contract:
  - con_key: CON-900001
    type: customer_project
    sup_key: null
    cus_key: CUS-900001
    parent_con_key: CON-900002
  - con_key: CON-900002
    type: customer_project
    sup_key: null
    cus_key: CUS-900001
    parent_con_key: CON-900001
  purchase_order:
  - prj_key: PRJ-900001
    con_key: null
args:
  prj_key: PRJ-900001
raises:
  error: FrameError
  message: the parent chain of CON-900001 loops at CON-900001
  names:
  - parent chain
  - loops
