id: err02-variants-table-unknown-default
rule: The default profile name is not one of the known comparable profiles.
function: variants_table
frames:
  project:
  - prj_key: PRJ-900001
    country: 1
    type: 1
    soil_class: 1
    route_length_m: 1
    legacy: 1
    data_depth: 1
    start: '2031-01-05'
    actual_end: 1
args:
  default: no_such_profile
raises:
  error: FrameError
  message: unknown default profile 'no_such_profile'
  names:
  - default
  - no_such_profile
