id: err22-notification-clauses-on-two-clauses-on-one-date
rule: A contract with two notification clauses valid on the date is refused.
function: notification_clauses_on
frames:
  clause:
  - con_key: CON-900001
    clause_no: 1
    clause_type: notification
    variant: standard
    param_name: notification_hours
    param_value: 24
    param2_name: null
    param2_value: null
    valid_from: '2031-01-05'
    valid_to: null
    verify: false
    legal_note: null
  - con_key: CON-900001
    clause_no: 2
    clause_type: notification
    variant: standard
    param_name: notification_hours
    param_value: 24
    param2_name: null
    param2_value: null
    valid_from: '2031-01-05'
    valid_to: null
    verify: false
    legal_note: null
  contract:
  - con_key: CON-900001
    cus_key: CUS-900001
args:
  as_of: '2031-02-01'
raises:
  error: FrameError
  message: contract CON-900001 has more than one notification clause on this date
  names:
  - CON-900001
  - more than one notification clause
