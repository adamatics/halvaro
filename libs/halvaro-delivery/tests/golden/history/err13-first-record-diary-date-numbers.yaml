id: err13-first-record-diary-date-numbers
rule: 'A diary_date that holds numbers is refused: they would read as nanoseconds.'
function: first_record
frames:
  site_diary:
  - prj_key: PRJ-900001
    diary_date: 5
    notes: a
    author_emp_key: EMP-900001
    delay_seq: 1
args:
  prj_key: PRJ-900001
raises:
  error: FrameError
  message: projects.site_diary.diary_date holds numbers, not dates
  names:
  - diary_date
  - numbers
