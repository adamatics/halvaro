id: err21-attendance-person-twice-in-meeting
rule: A person who appears twice in one meeting is refused, with the person and the meeting named.
function: attendance
frames:
  meeting:
  - mtg_key: MTG-900001
    prj_key: PRJ-900001
    date: '2031-01-05'
    meeting_type: 1
  meeting_attendance:
  - mtg_key: MTG-900001
    attendee_type: employee
    emp_key: EMP-900001
    cnt_key: null
    status: present
    role_in_meeting: 1
  - mtg_key: MTG-900001
    attendee_type: employee
    emp_key: EMP-900001
    cnt_key: null
    status: present
    role_in_meeting: 1
args: {}
raises:
  error: FrameError
  message: EMP-900001 appears more than once in meeting MTG-900001; one attendance row per person and meeting is required
  names:
  - EMP-900001
  - MTG-900001
