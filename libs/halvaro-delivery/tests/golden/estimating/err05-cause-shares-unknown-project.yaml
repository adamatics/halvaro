id: err05-cause-shares-unknown-project
rule: A project of the delay events is not in the project frame.
function: cause_shares
frames:
  delay_event:
  - prj_key: PRJ-900001
    cause_code: weather
    responsible_party: customer
    days: 1
    mtg_key: MTG-900001
  project:
  - prj_key: PRJ-900002
    data_depth: 1
args: {}
raises:
  error: FrameError
  message: 1 projects of the delay events are not in the project frame (for example PRJ-900001)
  names:
  - project
  - PRJ-900001
