id: e03-superseded-has-nulls
rule: "as_first_booked is refused when is_superseded has nulls, because every line must say whether it was replaced."
function: as_first_booked
frames:
  L: [{"le_key": "LE-900001", "period": "2030-05", "scope": 1, "category": "fuel", "line_no": 1, "kgco2e": 10.0, "quantity": 5.0, "efac_key": "EF-900001", "method": null, "ghg_category": "1", "restated_from_period": null, "supersedes_line_no": null, "is_superseded": null}]
raises:
  error: FrameError
  message: "energy-esg.emission_line.is_superseded has nulls"
  names: ["is_superseded", "nulls"]
