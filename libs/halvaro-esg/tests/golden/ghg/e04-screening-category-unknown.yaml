id: e04-screening-category-unknown
rule: "scope3_coverage is refused when screening names a category that is not a scope 3 category."
function: scope3_coverage
frames:
  L: [{"le_key": "LE-900001", "period": "2030-05", "scope": 1, "category": "fuel", "line_no": 1, "kgco2e": 10.0, "quantity": 5.0, "efac_key": "EF-900001", "method": null, "ghg_category": "1", "restated_from_period": null, "supersedes_line_no": null, "is_superseded": false}]
args: {"year": 2030, "screening": {"3.99": "not relevant"}}
raises:
  error: FrameError
  message: "screening names '3.99', which is not a scope 3 category"
  names: ["screening", "'3.99'"]
