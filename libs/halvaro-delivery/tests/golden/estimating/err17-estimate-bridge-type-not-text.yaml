id: err17-estimate-bridge-type-not-text
rule: A version type that is not text is refused.
function: estimate_bridge
frames:
  estimate_version:
  - prj_key: PRJ-900001
    estimate_version: 1
    type: 5
    date: '2031-01-05'
    currency: EUR
    total_cost: 1
  estimate_line:
  - prj_key: PRJ-900001
    estimate_version: 1
    cst_key: CST-900001
    amount: 1
  cost_code:
  - cst_key: CST-900001
    category: civil
args: {}
raises:
  error: FrameError
  message: projects.estimate_version.type must be text without nulls
  names:
  - estimate_version.type
  - text
