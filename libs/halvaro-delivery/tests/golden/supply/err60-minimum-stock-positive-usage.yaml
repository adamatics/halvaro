id: err60-minimum-stock-positive-usage
rule: A usage movement with a positive quantity is refused.
function: minimum_stock
frames:
  stock_movement:
  - site_key: SITE-900001
    itm_key: ITM-900001
    movement_date: '2031-01-05'
    movement_type: issue_project
    qty: 2
    prj_key: null
    reservation_no: null
  lead_time:
  - sup_key: SUP-900001
    itm_key: ITM-900001
    valid_from: '2031-01-01'
    valid_to: null
    lead_time_weeks: 4
  item:
  - itm_key: ITM-900001
    stocked: true
    preferred_sup_key: SUP-900001
args:
  as_of: '2031-02-01'
raises:
  error: FrameError
  message: a usage movement has a positive quantity; issues are negative
  names:
  - usage movement
  - positive quantity
