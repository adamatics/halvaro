id: err36-cause-shares-days-not-numeric
rule: A text days column in the delay events is refused.
function: cause_shares
frames:
  delay_event:
  - prj_key: PRJ-900001
    cause_code: weather
    responsible_party: customer
    days: many
    mtg_key: MTG-900001
  project:
  - prj_key: PRJ-900001
    data_depth: full
args: {}
raises:
  error: FrameError
  message: projects.delay_event.days must be numeric without nulls
  names:
  - delay_event.days
  - numeric
