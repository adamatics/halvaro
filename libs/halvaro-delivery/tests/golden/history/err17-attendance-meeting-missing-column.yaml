id: err17-attendance-meeting-missing-column
rule: The meeting frame lacks a column the function needs, here meeting_type.
function: attendance
frames:
  meeting:
  - mtg_key: MTG-900001
    prj_key: PRJ-900001
    date: '2031-01-05'
  meeting_attendance:
  - mtg_key: MTG-900001
    attendee_type: employee
    emp_key: EMP-900001
    cnt_key: null
    status: present
    role_in_meeting: 1
args: {}
raises:
  error: FrameError
  message: projects.meeting lacks column(s) meeting_type; load the source columns without renaming them
  names:
  - projects.meeting
  - meeting_type
