id: err10-price-list-on-as-of-time-zone
rule: An as_of with a time zone is refused.
function: price_list_on
frames:
  price_list:
  - sup_key: SUP-900001
    itm_key: ITM-900001
    valid_from: '2031-01-05'
    valid_to: null
    unit_price: 1
    currency: EUR
    con_key: CON-900001
    change_reason: 1
args:
  as_of: '2031-02-01T00:00:00+01:00'
raises:
  error: FrameError
  message: as_of '2031-02-01T00:00:00+01:00' is not a date without a time zone
  names:
  - as_of
  - time zone
