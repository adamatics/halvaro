id: err30-blocked-projects-reservation-null-key
rule: A reservation without a prj_key is refused.
function: blocked_projects
frames:
  reservations_open:
  - prj_key: null
    itm_key: ITM-900001
    site_key: SITE-900001
    qty_open: 1
    needed_by_date: '2031-03-01'
  stock:
  - site_key: SITE-900001
    itm_key: ITM-900001
    on_hand: 0
args:
  as_of: '2031-02-01'
  items:
  - ITM-900001
  active:
  - PRJ-900001
raises:
  error: FrameError
  message: reserved_demand output.prj_key has nulls; a reservation needs its project, item, site and need date
  names:
  - reserved_demand output.prj_key
  - nulls
