id: e01-min-completeness-above-one
rule: A completeness threshold outside 0 to 1 is refused, because it is a share of the expected samples.
function: element_peak_load
frames:
  sensor:
  - sns_key: SNS-900001
    net_key: NET-900001
    rated_value: 100.0
    install_date: '2030-01-01'
    sensor_type: load_percent
    interval_s: 900
  measurement_daily:
  - sns_key: SNS-900001
    date: '2031-02-01'
    max: 50.0
    availability_pct: 100.0
args:
  min_completeness: 1.5
raises:
  error: FrameError
  message: 'min_completeness is a share from 0 to 1 (got 1.5)'
  names:
  - min_completeness
  - 0 to 1
