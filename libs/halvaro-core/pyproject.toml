[build-system]
requires = ["setuptools>=77", "setuptools-scm==10.3.4"]
build-backend = "setuptools.build_meta"

[project]
name = "halvaro-core"
dynamic = ["version"]
description = "Shared foundation of the Halvaro Infra libraries: keys, periods, facts, stage and access guard, org, calendar, money"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["pandas>=2.0,<3", "PyYAML>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "jsonschema>=4"]

# Version from the Git tag halvaro-core/v<major>.<minor>.<patch>, as the other libraries (lane L4, #544; default taken, proposed: option C of notes/library-versioning.md). setuptools-scm reads the local repository, no network.
# The build writes src/halvaro/core/_version_scm.py (git-ignored, into the wheel). The tracked _version.py imports it and keeps the committed fallback for a checkout that is not built.
[tool.setuptools_scm]
root = "../.."
tag_regex = "^halvaro-core/v(?P<version>[0-9]+\\.[0-9]+\\.[0-9]+)$"
git_describe_command = ["git", "describe", "--dirty", "--tags", "--long", "--match", "halvaro-core/v*"]
version_file = "src/halvaro/core/_version_scm.py"
fallback_version = "0.1.0"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.setuptools.package-data]
"halvaro.core" = ["py.typed", "_data/*.json", ".agents/skills/*/SKILL.md", ".agents/skills/*/references/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests", "repo_tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
    "release: needs an exported release (set HALVARO_RELEASE_DIR)",
    "slow: more than a few seconds",
]
