id: err11-reserved-demand-as-of-number
rule: The as_of day is a number, not a date.
function: reserved_demand
frames:
  reservation:
  - prj_key: PRJ-900001
    itm_key: ITM-900001
    reservation_no: 1
    site_key: SIT-900001
    qty: 1
    created_date: '2031-01-05'
    needed_by_date: '2031-01-05'
    po_key: PO-900001
    po_line_no: 1
  stock_movement:
  - movement_type: 1
    movement_date: '2031-01-05'
    qty: 1
    prj_key: PRJ-900001
    reservation_no: 1
    itm_key: ITM-900001
args:
  as_of: 7
raises:
  error: FrameError
  message: as_of 7 is a number, not a date
  names:
  - as_of
  - '7'
