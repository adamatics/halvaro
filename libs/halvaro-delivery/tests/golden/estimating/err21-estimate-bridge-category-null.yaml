id: err21-estimate-bridge-category-null
rule: A cost code without a category is refused.
function: estimate_bridge
frames:
  estimate_version:
  - prj_key: PRJ-900001
    estimate_version: 1
    type: tender
    date: '2031-01-05'
    currency: EUR
    total_cost: 1
  estimate_line:
  - prj_key: PRJ-900001
    estimate_version: 1
    cst_key: CST-900001
    amount: 1
  cost_code:
  - cst_key: CST-900001
    category: null
args: {}
raises:
  error: FrameError
  message: projects.cost_code.category has nulls
  names:
  - cost_code.category
  - nulls
