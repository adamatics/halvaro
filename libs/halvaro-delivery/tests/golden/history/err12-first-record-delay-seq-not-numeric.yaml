id: err12-first-record-delay-seq-not-numeric
rule: A text delay_seq is refused.
function: first_record
frames:
  site_diary:
  - prj_key: PRJ-900001
    diary_date: '2031-01-05'
    notes: a
    author_emp_key: EMP-900001
    delay_seq: first
args:
  prj_key: PRJ-900001
raises:
  error: FrameError
  message: projects.site_diary.delay_seq must be numeric
  names:
  - site_diary.delay_seq
  - numeric
