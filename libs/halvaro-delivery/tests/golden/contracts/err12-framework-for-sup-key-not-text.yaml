id: err12-framework-for-sup-key-not-text
rule: sup_key must be one key as text, not a number.
function: framework_for
frames:
  contract:
  - con_key: CON-900001
    type: supplier_framework
    sup_key: SUP-900001
    status: in_force
    start: '2031-01-05'
    end: null
args:
  sup_key: 5
  as_of: '2031-02-01'
raises:
  error: FrameError
  message: sup_key is one key as text, not int
  names:
  - sup_key
  - int
