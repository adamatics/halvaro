id: err15-plan-slip-null-in-key
rule: A plan version row with a null prj_key is refused, with the key columns named.
function: plan_slip
frames:
  plan_version:
  - prj_key: null
    plan_version: 1
    created: '2031-01-05'
    reason: x
    planned_end: '2031-06-01'
args: {}
raises:
  error: FrameError
  message: projects.plan_version has rows with a null in prj_key, plan_version
  names:
  - projects.plan_version
  - prj_key
