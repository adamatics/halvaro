id: err45-supplier-performance-recompute-line-no-type-differs
rule: A line_no that differs in type between po_line and goods_receipt is refused.
function: supplier_performance_recompute
frames:
  po_line:
  - po_key: PO-900001
    line_no: 1
    itm_key: ITM-900001
    qty: 5
    promised_date: '2031-02-01'
    requested_date: '2031-01-20'
  purchase_order:
  - po_key: PO-900001
    sup_key: SUP-900001
    prj_key: PRJ-900001
    order_date: '2031-01-05'
    status: open
  goods_receipt:
  - po_key: PO-900001
    line_no: '1'
    receipt_date: '2031-01-20'
    qty_accepted: 1
args:
  as_of: '2031-02-01'
raises:
  error: FrameError
  message: procurement.po_line.line_no and goods_receipt.line_no have different types
  names:
  - line_no
  - goods_receipt
