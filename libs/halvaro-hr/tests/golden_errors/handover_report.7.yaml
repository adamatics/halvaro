# Golden error case of halvaro-hr.handover_report: the message is the golden text (tests/test_golden_errors.py); change it only on purpose.
function: handover_report
why: the allocations hold one row twice
args:
- frame:
    columns:
    - emp_key
    - prj_key
    - start
    - end
    - percent
    rows:
    - &id001
      - EMP-X1
      - PRJ-X
      - 2026-01-01
      - 2026-01-31
      - 50
    - *id001
- frame:
    columns:
    - emp_key
    - leave_type
    - start
    - end
    rows:
    - - EMP-X1
      - parental
      - 2026-02-01
      - 2026-03-01
kwargs:
  leave_types:
  - parental
raises: FrameError
message: hr.allocation has 1 duplicate rows (identical rows or a repeated alc_key); a repeated row would be reported twice
