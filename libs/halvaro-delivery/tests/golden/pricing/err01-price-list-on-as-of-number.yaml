id: err01-price-list-on-as-of-number
rule: The day argument as_of is a number, not a date or ISO text, so the function refuses it.
function: price_list_on
frames:
  price_list:
  - sup_key: SUP-900001
    itm_key: ITM-900001
    valid_from: '2031-01-05'
    valid_to: '2031-01-05'
    unit_price: 1
    currency: 1
    con_key: CON-900001
    change_reason: 1
args:
  as_of: 7
raises:
  error: FrameError
  message: as_of 7 is a number, not a date
  names:
  - as_of
  - '7'
