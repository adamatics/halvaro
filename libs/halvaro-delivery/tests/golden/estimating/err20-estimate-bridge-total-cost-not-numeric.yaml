id: err20-estimate-bridge-total-cost-not-numeric
rule: A text total_cost is refused.
function: estimate_bridge
frames:
  estimate_version:
  - prj_key: PRJ-900001
    estimate_version: 1
    type: tender
    date: '2031-01-05'
    currency: EUR
    total_cost: high
  estimate_line:
  - prj_key: PRJ-900001
    estimate_version: 1
    cst_key: CST-900001
    amount: 1
  cost_code:
  - cst_key: CST-900001
    category: civil
args: {}
raises:
  error: FrameError
  message: projects.estimate_version.total_cost must be numeric without nulls
  names:
  - estimate_version.total_cost
  - numeric
