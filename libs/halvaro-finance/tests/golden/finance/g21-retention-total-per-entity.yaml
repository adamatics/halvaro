name: The retention total of an entity is the sum of the retention held per item
function: retention_receivable
cites: [FI.REF.022]
by_hand: Two invoices hold 100 and 50 of retention and a third holds none. The items listed are the two with retention; the total row of the entity is 100 + 50 = 150.
context: month3
input:
  open_items:
    columns: [item_key, source, le_key, cus_key, inv_key, document_date, due_date, currency, invoice_amount, paid, written_off, open_amount, retention_held, release_date]
    rows:
      - [I1, invoice, LE-01, CUS-1, I1, "2025-01-10", "2025-02-10", DKK, 1000.0, 0.0, 0.0, 1000.0, 100.0, "2025-06-30"]
      - [I2, invoice, LE-01, CUS-2, I2, "2025-01-11", "2025-02-11", DKK, 500.0, 0.0, 0.0, 500.0, 50.0, "2025-06-30"]
      - [I3, invoice, LE-01, CUS-3, I3, "2025-01-12", "2025-02-12", DKK, 300.0, 0.0, 0.0, 300.0, 0.0, null]
expect:
  rows:
    - {item_key: I1, source: invoice, retention_held: 100.0}
    - {item_key: I2, source: invoice, retention_held: 50.0}
    - {source: total, le_key: LE-01, retention_held: 150.0}
