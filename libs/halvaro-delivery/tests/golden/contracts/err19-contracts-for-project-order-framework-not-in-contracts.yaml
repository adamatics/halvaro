id: err19-contracts-for-project-order-framework-not-in-contracts
rule: A framework named by an order that contracts.contract does not hold is refused.
function: contracts_for_project
frames:
  project:
  - prj_key: PRJ-900001
    contract_key: CON-900001
  contract:
  - con_key: CON-900001
    type: customer_project
    sup_key: null
    cus_key: CUS-900001
    parent_con_key: null
  purchase_order:
  - prj_key: PRJ-900001
    con_key: CON-900003
args:
  prj_key: PRJ-900001
raises:
  error: FrameError
  message: the framework CON-900003 of an order of PRJ-900001 is not in contracts.contract
  names:
  - CON-900003
  - contracts.contract
