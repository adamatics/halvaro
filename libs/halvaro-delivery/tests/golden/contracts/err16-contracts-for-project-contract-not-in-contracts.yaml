id: err16-contracts-for-project-contract-not-in-contracts
rule: The contract of a project that contracts.contract does not hold is refused.
function: contracts_for_project
frames:
  project:
  - prj_key: PRJ-900001
    contract_key: CON-900001
  contract:
  - con_key: CON-900002
    type: customer_project
    sup_key: null
    cus_key: CUS-900001
    parent_con_key: null
  purchase_order:
  - prj_key: PRJ-900001
    con_key: null
args:
  prj_key: PRJ-900001
raises:
  error: FrameError
  message: the contract CON-900001 of PRJ-900001 is not in contracts.contract
  names:
  - CON-900001
  - contracts.contract
