id: err08-estimate-bridge-missing-column
rule: The cost_code frame lacks a column the function needs, here category.
function: estimate_bridge
frames:
  estimate_version:
  - prj_key: PRJ-900001
    estimate_version: 1
    type: tender
    date: '2031-01-05'
    currency: EUR
    total_cost: 1
  estimate_line:
  - prj_key: PRJ-900001
    estimate_version: 1
    cst_key: CST-900001
    amount: 1
  cost_code:
  - cst_key: CST-900001
args: {}
raises:
  error: FrameError
  message: projects.cost_code lacks column(s) category; load the source columns without renaming them
  names:
  - projects.cost_code
  - category
