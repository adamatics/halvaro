id: err20-variants-table-metric-duplicate-project
rule: A metric frame with two rows for one project is refused.
function: variants_table
frames:
  project:
  - prj_key: PRJ-900001
    country: DE
    type: dh_network
    soil_class: clay
    route_length_m: 5000
    legacy: false
    data_depth: full
    start: '2031-01-05'
    actual_end: '2031-06-01'
  metric:
  - prj_key: PRJ-900001
    value: 1
  - prj_key: PRJ-900001
    value: 2
args:
  as_of: '2031-12-01'
raises:
  error: FrameError
  message: the metric frame has more than one row for a project
  names:
  - metric
  - more than one row
