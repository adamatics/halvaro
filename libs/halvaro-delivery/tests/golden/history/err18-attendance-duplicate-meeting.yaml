id: err18-attendance-duplicate-meeting
rule: A meeting held twice in the meeting frame is refused, with the key named.
function: attendance
frames:
  meeting:
  - mtg_key: MTG-900001
    prj_key: PRJ-900001
    date: '2031-01-05'
    meeting_type: 1
  - mtg_key: MTG-900001
    prj_key: PRJ-900001
    date: '2031-01-05'
    meeting_type: 1
  meeting_attendance:
  - mtg_key: MTG-900001
    attendee_type: employee
    emp_key: EMP-900001
    cnt_key: null
    status: present
    role_in_meeting: 1
args: {}
raises:
  error: FrameError
  message: projects.meeting has more than one row for MTG-900001; one row per key is required
  names:
  - projects.meeting
  - MTG-900001
