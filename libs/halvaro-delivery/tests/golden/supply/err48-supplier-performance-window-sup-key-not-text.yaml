id: err48-supplier-performance-window-sup-key-not-text
rule: sup_key must be one key given as text.
function: supplier_performance_window
frames:
  performance:
  - sup_key: SUP-900001
    period: 2031-01
    lines_due: 2
    lines_on_time: 1
args:
  first_period: 2031-01
  last_period: 2031-02
  sup_key: 5
raises:
  error: FrameError
  message: sup_key is one key given as text, not 5
  names:
  - sup_key
  - text
