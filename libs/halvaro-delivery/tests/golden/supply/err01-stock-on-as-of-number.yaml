id: err01-stock-on-as-of-number
rule: The day argument as_of is a number, not a date or ISO text, so the function refuses it.
function: stock_on
frames:
  stock_movement:
  - site_key: SIT-900001
    itm_key: ITM-900001
    movement_date: '2031-01-05'
    qty: 1
args:
  as_of: 7
raises:
  error: FrameError
  message: as_of 7 is a number, not a date
  names:
  - as_of
  - '7'
