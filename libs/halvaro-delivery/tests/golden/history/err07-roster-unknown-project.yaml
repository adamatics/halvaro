id: err07-roster-unknown-project
rule: A project key of the list is not in the project frame.
function: roster
frames:
  project_role:
  - prj_key: PRJ-900001
    emp_key: EMP-900001
    project_role: 1
    start: '2031-01-05'
    end: '2031-01-05'
    hours_total: 1
    basis: 1
  project:
  - prj_key: PRJ-900002
    legacy: 1
args:
  prj_keys:
  - PRJ-900001
raises:
  error: FrameError
  message: 1 projects of the list are not in the project frame (for example PRJ-900001)
  names:
  - project
  - PRJ-900001
