id: err38-risk-lessons-summary-delay-seq-not-whole
rule: A fractional delay_seq in projects.risk is refused.
function: risk_lessons_summary
frames:
  risk:
  - prj_key: PRJ-900001
    risk_no: 1
    cause_code: weather
    status: occurred
    delay_seq: 1.5
  lesson_learned:
  - prj_key: PRJ-900001
    category: weather
    delay_seq: 1
  delay_event:
  - prj_key: PRJ-900001
    seq: 1
    cause_code: weather
args: {}
raises:
  error: FrameError
  message: projects.risk.delay_seq must hold whole numbers
  names:
  - projects.risk.delay_seq
  - whole numbers
