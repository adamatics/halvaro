id: err32-timeline-delay-event-days-not-whole
rule: A fractional days value in the delay events is refused.
function: timeline
frames:
  site_diary:
  - prj_key: PRJ-900001
    diary_date: '2031-01-05'
    delay_seq: 1
    notes: a
  risk:
  - prj_key: PRJ-900001
    risk_no: 1
    raised: '2031-01-05'
    title: t
    status: open
  meeting:
  - mtg_key: MTG-900001
    prj_key: PRJ-900001
    date: '2031-01-05'
    meeting_type: 1
    title: t
  decision:
  - mtg_key: MTG-900001
    seq: 1
    text: t
    decision_type: scope
  delay_event:
  - prj_key: PRJ-900001
    seq: 1
    start: '2031-01-05'
    days: 1.5
    cause_code: weather
  plan_version:
  - prj_key: PRJ-900001
    plan_version: 1
    created: '2031-01-05'
    reason: x
args:
  prj_key: PRJ-900001
raises:
  error: FrameError
  message: projects.delay_event.days must hold whole numbers without nulls
  names:
  - delay_event.days
  - whole numbers
