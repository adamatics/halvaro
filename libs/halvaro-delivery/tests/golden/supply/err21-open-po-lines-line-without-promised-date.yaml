id: err21-open-po-lines-line-without-promised-date
rule: A line without a promised_date is refused.
function: open_po_lines
frames:
  po_line:
  - po_key: PO-900001
    line_no: 1
    itm_key: ITM-900001
    qty: 5
    promised_date: null
    requested_date: '2031-02-01'
  purchase_order:
  - po_key: PO-900001
    sup_key: SUP-900001
    prj_key: PRJ-900001
    order_date: '2031-01-05'
    status: open
  goods_receipt:
  - po_key: PO-900001
    line_no: 1
    receipt_date: '2031-01-20'
    qty_accepted: 1
args:
  as_of: '2031-02-01'
raises:
  error: FrameError
  message: procurement.po_line has lines without promised_date or requested_date
  names:
  - po_line
  - promised_date
