id: err11-framework-for-duplicate-con-key
rule: A con_key held twice is refused, with the key named.
function: framework_for
frames:
  contract:
  - con_key: CON-900001
    type: supplier_framework
    sup_key: SUP-900001
    status: in_force
    start: '2031-01-05'
    end: null
  - con_key: CON-900001
    type: supplier_framework
    sup_key: SUP-900001
    status: in_force
    start: '2031-01-05'
    end: null
args:
  sup_key: SUP-900001
  as_of: '2031-02-01'
raises:
  error: FrameError
  message: contracts.contract has more than one row for CON-900001; one row per key is required
  names:
  - contracts.contract
  - CON-900001
