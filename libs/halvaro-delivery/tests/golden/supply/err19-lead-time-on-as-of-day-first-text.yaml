id: err19-lead-time-on-as-of-day-first-text
rule: An as_of in day-first text is refused, it would be read month first.
function: lead_time_on
frames:
  lead_time:
  - sup_key: SUP-900001
    itm_key: ITM-900001
    valid_from: '2031-01-01'
    valid_to: null
    lead_time_weeks: 4
args:
  as_of: 01-02-2031
raises:
  error: FrameError
  message: as_of '01-02-2031' is not an ISO date YYYY-MM-DD; a day-first text is not read
  names:
  - as_of
  - YYYY-MM-DD
