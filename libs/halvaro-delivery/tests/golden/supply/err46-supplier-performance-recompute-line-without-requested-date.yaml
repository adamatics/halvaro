id: err46-supplier-performance-recompute-line-without-requested-date
rule: A line without a requested_date is refused.
function: supplier_performance_recompute
frames:
  po_line:
  - po_key: PO-900001
    line_no: 1
    itm_key: ITM-900001
    qty: 5
    promised_date: '2031-02-01'
    requested_date: null
  purchase_order:
  - po_key: PO-900001
    sup_key: SUP-900001
    prj_key: PRJ-900001
    order_date: '2031-01-05'
    status: open
  goods_receipt:
  - po_key: PO-900001
    line_no: 1
    receipt_date: '2031-01-20'
    qty_accepted: 1
args:
  as_of: '2031-02-01'
raises:
  error: FrameError
  message: procurement.po_line.requested_date has nulls
  names:
  - po_line.requested_date
  - nulls
