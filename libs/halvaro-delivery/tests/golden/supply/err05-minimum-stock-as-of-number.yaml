id: err05-minimum-stock-as-of-number
rule: The day argument as_of is a number, not a date or ISO text, so the function refuses it.
function: minimum_stock
frames:
  stock_movement:
  - site_key: SIT-900001
    itm_key: ITM-900001
    movement_date: '2031-01-05'
    movement_type: 1
    qty: 1
  lead_time:
  - sup_key: SUP-900001
    itm_key: ITM-900001
    valid_from: '2031-01-05'
    valid_to: '2031-01-05'
    lead_time_weeks: 1
  item:
  - itm_key: ITM-900001
    stocked: 1
    preferred_sup_key: PREFERRED-900001
args:
  as_of: 7
raises:
  error: FrameError
  message: as_of 7 is a number, not a date
  names:
  - as_of
  - '7'
