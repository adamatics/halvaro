id: err53-at-risk-items-min-lines-not-whole
rule: min_lines that is not a whole number is refused.
function: at_risk_items
frames:
  stock:
  - site_key: SITE-900001
    itm_key: ITM-900001
    on_hand: 0
  open_lines:
  - sup_key: SUP-900001
    itm_key: ITM-900001
    slip_days: 0
    days_overdue: 0
  alerts:
  - sup_key: SUP-900001
    itm_key: ITM-900001
  window_performance:
  - sup_key: SUP-900001
    on_time_percent: 90.0
args:
  items:
  - ITM-900001
  site: SITE-900001
  sup_key: SUP-900001
  as_of: '2031-02-01'
  min_lines: -1
raises:
  error: FrameError
  message: min_lines is a whole number, zero or more, or None, not -1
  names:
  - min_lines
  - whole number
