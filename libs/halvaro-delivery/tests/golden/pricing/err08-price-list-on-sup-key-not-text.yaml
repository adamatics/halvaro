id: err08-price-list-on-sup-key-not-text
rule: sup_key must be one key as text, not a number.
function: price_list_on
frames:
  price_list:
  - sup_key: SUP-900001
    itm_key: ITM-900001
    valid_from: '2031-01-05'
    valid_to: null
    unit_price: 1
    currency: EUR
    con_key: CON-900001
    change_reason: 1
args:
  as_of: '2031-02-01'
  sup_key: 5
raises:
  error: FrameError
  message: sup_key is one key as text, not int
  names:
  - sup_key
  - int
