id: err05-delay-days-zero-days
rule: A delay event with zero or negative days is refused; days must be positive.
function: delay_days
frames:
  delay_event:
  - prj_key: PRJ-900001
    seq: 1
    days: 0
    cause_code: weather
    responsible_party: customer
args: {}
raises:
  error: FrameError
  message: projects.delay_event.days must be positive; 1 rows are zero or negative (for example PRJ-900001)
  names:
  - days
  - PRJ-900001
