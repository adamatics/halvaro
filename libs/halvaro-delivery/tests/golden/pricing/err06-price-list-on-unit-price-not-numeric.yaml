id: err06-price-list-on-unit-price-not-numeric
rule: A text unit_price is refused.
function: price_list_on
frames:
  price_list:
  - sup_key: SUP-900001
    itm_key: ITM-900001
    valid_from: '2031-01-05'
    valid_to: null
    unit_price: cheap
    currency: EUR
    con_key: CON-900001
    change_reason: 1
args:
  as_of: '2031-02-01'
raises:
  error: FrameError
  message: procurement.price_list.unit_price must be numeric
  names:
  - unit_price
  - numeric
