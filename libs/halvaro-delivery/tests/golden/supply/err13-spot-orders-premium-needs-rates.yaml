id: err13-spot-orders-premium-needs-rates
rule: A framework supplier is given without rates, so no premium can be worked out.
function: spot_orders
frames:
  po_line:
  - po_key: PO-900001
    line_no: 1
    itm_key: ITM-900001
    unit_price: 1
    currency: EUR
    price_source: spot
    expedite: false
  purchase_order:
  - po_key: PO-900001
    order_type: spot
    sup_key: SUP-900001
    prj_key: PRJ-900001
    order_date: '2031-01-05'
  price_list:
  - sup_key: SUP-900001
    itm_key: ITM-900001
    valid_from: '2031-01-05'
    valid_to: '2031-01-05'
    unit_price: 1
    currency: EUR
    change_reason: 1
args:
  framework_sup_key: SUP-900001
raises:
  error: FrameError
  message: a premium needs both framework_sup_key and rates
  names:
  - framework_sup_key
  - rates
