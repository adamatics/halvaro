function: expected_goods_lines
frames:
  goods_receipt: [{"po_key": "PO-900001", "line_no": 1, "receipt_type": "full", "qty_accepted": 5.0, "receipt_date": "2030-05-02"}]
  po_line: [{"po_key": "PO-900001", "line_no": 1, "itm_key": "ITM-900001"}]
  purchase_order: [{"po_key": "PO-900001", "sup_key": "SUP-900001"}]
  item: [{"itm_key": "ITM-900001", "category": "cable", "footprint_kgco2e_per_unit": 2.0}]
  f: [{"efac_key": "EF-900001", "category": "electricity", "carrier": "electricity", "region": "DK", "method": "location", "kgco2e_per_unit": 0.1, "unit": "kWh", "valid_from": "2030-01-01", "valid_to": null, "factor_set": "FS-900001"}]
