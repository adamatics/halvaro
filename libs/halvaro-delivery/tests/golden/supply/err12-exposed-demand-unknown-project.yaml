id: err12-exposed-demand-unknown-project
rule: An active project with open demand is not in the project frame.
function: exposed_demand
frames:
  open_lines:
  - po_key: PO-900001
    line_no: 1
    prj_key: PRJ-900001
    itm_key: ITM-900001
    sup_key: SUP-900001
    order_date: '2031-01-05'
    remaining: 1
  reservations_open:
  - prj_key: PRJ-900001
    itm_key: ITM-900001
    qty_open: 1
    po_key: null
  price_list:
  - sup_key: SUP-900001
    itm_key: ITM-900001
  project:
  - prj_key: PRJ-900002
    price_type: 1
args:
  sup_key: SUP-900001
  effective_from: '2031-01-05'
  active:
  - PRJ-900001
raises:
  error: FrameError
  message: 1 active projects with demand are not in the project frame (for example PRJ-900001)
  names:
  - project
  - PRJ-900001
