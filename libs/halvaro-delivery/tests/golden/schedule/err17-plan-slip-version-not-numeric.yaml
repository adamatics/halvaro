id: err17-plan-slip-version-not-numeric
rule: A text plan_version is refused.
function: plan_slip
frames:
  plan_version:
  - prj_key: PRJ-900001
    plan_version: first
    created: '2031-01-05'
    reason: x
    planned_end: '2031-06-01'
args: {}
raises:
  error: FrameError
  message: projects.plan_version.plan_version must be numeric
  names:
  - plan_version
  - numeric
