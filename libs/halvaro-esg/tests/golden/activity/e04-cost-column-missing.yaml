id: e04-cost-column-missing
rule: "energy_cost is refused when the consumption frame lacks cost_amount and currency."
function: energy_cost
frames:
  c: [{"mtr_key": "MTR-900001", "period": "2030-05", "quantity": 100.0, "unit": "kWh", "contract_type": "grid_mix"}]
  m: [{"mtr_key": "MTR-900001", "carrier": "electricity", "kind": "grid", "scope": 2, "unit": "kWh", "site_key": "SITE-900001"}]
raises:
  error: FrameError
  message: "energy-esg.energy_consumption frame lacks column(s) cost_amount, currency; load the source columns without renaming them"
  names: ["cost_amount", "currency"]
