id: err40-contingency-advice-unknown-quantile
rule: A quantile other than q25, median or q75 is refused.
function: contingency_advice
frames:
  overrun_dist:
  - measure: schedule
    n: 1
    n_legacy: 0
    q25: 0.1
    median: 0.1
    q75: 0.2
  shares:
  - view: all_events
    cause_code: ground_conditions
    days: 1
  lines:
  - prj_key: PRJ-900001
    type: tender
    cst_key: CST-900001
    category: civil
    amount: 1
    currency: EUR
args:
  quantile: q90
raises:
  error: FrameError
  message: quantile is q25, median or q75
  names:
  - q25
  - q75
