name: The ledger balance grows by one monthly rate per month without leave taken
function: holiday_ledger
cites: [dk/ferieloven/p-0005]
by_hand: Nothing carried in and nothing taken, so the balance after n months is n times the monthly rate.
let:
  rate: "=fact('legal.DK.holiday.accrual_days_per_month')"
input:
  ent:
    columns: [emp_key, holiday_year, carried_in_days, opening_balance]
    rows:
      - [EMP-1, "2026/27", 0.0, false]
  acc:
    columns: [emp_key, holiday_year, period, accrued_days, taken_days]
    rows:
      - [EMP-1, "2026/27", "2026-10", "=rate", 0.0]
      - [EMP-1, "2026/27", "2026-11", "=rate", 0.0]
      - [EMP-1, "2026/27", "2026-12", "=rate", 0.0]
expect:
  rows:
    - {period: "2026-10", balance: "=round(1 * rate, 2)", negative: false}
    - {period: "2026-11", balance: "=round(2 * rate, 2)", negative: false}
    - {period: "2026-12", balance: "=round(3 * rate, 2)", negative: false}
