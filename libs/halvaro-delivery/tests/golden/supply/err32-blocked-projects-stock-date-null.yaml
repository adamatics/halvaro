id: err32-blocked-projects-stock-date-null
rule: A stock frame whose as_of column has nulls is refused.
function: blocked_projects
frames:
  reservations_open:
  - prj_key: PRJ-900001
    itm_key: ITM-900001
    site_key: SITE-900001
    qty_open: 1
    needed_by_date: '2031-03-01'
  stock:
  - site_key: SITE-900001
    itm_key: ITM-900001
    on_hand: 0
    as_of: null
args:
  as_of: '2031-02-01'
  items:
  - ITM-900001
  active:
  - PRJ-900001
raises:
  error: FrameError
  message: stock_on output.as_of has nulls
  names:
  - stock_on output.as_of
  - nulls
