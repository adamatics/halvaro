# Type check of the holiday module (holiday.py and its result models holiday_results.py) only (standard 3.1, issue #196 F1). Run: python -m mypy --config-file mypy-holiday.ini
# Every other module of the library is read for its types (follow_imports = silent) and is not reported; widening the list of files is a later step.
[mypy]
cache_dir = .mypy_cache/holiday
files = src/halvaro/hr/holiday.py, src/halvaro/hr/holiday_results.py
mypy_path = src:../halvaro-core/src
namespace_packages = True
explicit_package_bases = True
python_version = 3.10
follow_imports = silent
disallow_untyped_defs = True
disallow_incomplete_defs = True
disallow_any_generics = True
no_implicit_optional = True
warn_return_any = True
warn_unused_ignores = True
warn_redundant_casts = True
show_error_codes = True
