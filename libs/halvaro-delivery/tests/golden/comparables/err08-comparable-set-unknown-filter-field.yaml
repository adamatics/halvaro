id: err08-comparable-set-unknown-filter-field
rule: A filter field the rule does not know is refused, with the allowed fields listed.
function: comparable_set
frames:
  project:
  - prj_key: PRJ-900001
    country: DE
    type: dh_network
    soil_class: clay
    route_length_m: 5000
    legacy: false
    data_depth: full
    start: '2031-01-05'
    actual_end: '2031-06-01'
args:
  as_of: '2031-12-01'
  overrides:
    colour: red
raises:
  error: FrameError
  message: 'unknown filter field(s) colour in a comparable rule; allowed: country, type, soil_class, status, route_min_m, route_max_m, start_from, end_from, require_route_length'
  names:
  - colour
  - allowed
