id: err24-exposed-demand-open-line-without-order-date
rule: An open line without an order_date is refused.
function: exposed_demand
frames:
  open_lines:
  - po_key: PO-900001
    line_no: 1
    prj_key: PRJ-900001
    itm_key: ITM-900001
    sup_key: SUP-900001
    order_date: null
    remaining: 1
  reservations_open:
  - prj_key: PRJ-900001
    itm_key: ITM-900001
    qty_open: 1
    po_key: null
  price_list:
  - sup_key: SUP-900001
    itm_key: ITM-900001
  project:
  - prj_key: PRJ-900001
    price_type: fixed
args:
  sup_key: SUP-900001
  effective_from: '2031-02-01'
  active:
  - PRJ-900001
raises:
  error: FrameError
  message: the open lines have rows without order_date
  names:
  - open lines
  - order_date
