id: err09-estimate-bridge-null-in-key
rule: A cost_code row with a null cst_key is refused, with the key columns named.
function: estimate_bridge
frames:
  estimate_version:
  - prj_key: PRJ-900001
    estimate_version: 1
    type: tender
    date: '2031-01-05'
    currency: EUR
    total_cost: 1
  estimate_line:
  - prj_key: PRJ-900001
    estimate_version: 1
    cst_key: CST-900001
    amount: 1
  cost_code:
  - cst_key: null
    category: civil
args: {}
raises:
  error: FrameError
  message: projects.cost_code has rows with a null in cst_key
  names:
  - projects.cost_code
  - cst_key
