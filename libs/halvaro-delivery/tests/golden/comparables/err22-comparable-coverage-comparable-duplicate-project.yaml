id: err22-comparable-coverage-comparable-duplicate-project
rule: A comparable frame that holds a project twice is refused.
function: comparable_coverage
frames:
  comparable:
  - &id001
    prj_key: PRJ-900001
  - *id001
  project:
  - prj_key: PRJ-900001
    final_cost: 1
    route_length_m: 1
  estimate_version:
  - prj_key: PRJ-900001
    type: final
  project_role:
  - *id001
args:
  time_entry_projects:
  - PRJ-900001
raises:
  error: FrameError
  message: the comparable frame has a project more than once
  names:
  - comparable
  - more than once
