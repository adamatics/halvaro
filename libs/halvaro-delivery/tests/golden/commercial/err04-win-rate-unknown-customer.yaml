id: err04-win-rate-unknown-customer
rule: An opportunity belongs to a customer that the customer frame does not hold.
function: win_rate
frames:
  opportunity:
  - opp_key: OPP-900001
    cus_key: CUS-900099
    stage: won
    decision_date: '2031-01-05'
  customer:
  - cus_key: CUS-900001
    tier: A
args: {}
raises:
  error: FrameError
  message: opportunities of customers that crm.customer does not hold, for example CUS-900099
  names:
  - customer
  - CUS-900099
