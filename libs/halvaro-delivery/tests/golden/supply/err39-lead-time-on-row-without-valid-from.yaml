id: err39-lead-time-on-row-without-valid-from
rule: A lead time row without valid_from is refused.
function: lead_time_on
frames:
  lead_time:
  - sup_key: SUP-900001
    itm_key: ITM-900001
    valid_from: null
    valid_to: null
    lead_time_weeks: 4
args:
  as_of: '2031-02-01'
raises:
  error: FrameError
  message: inventory.lead_time has a row without valid_from or a row that ends before it starts
  names:
  - lead_time
  - valid_from
