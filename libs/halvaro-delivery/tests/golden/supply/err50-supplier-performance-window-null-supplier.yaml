id: err50-supplier-performance-window-null-supplier
rule: A performance row without a sup_key is refused.
function: supplier_performance_window
frames:
  performance:
  - sup_key: null
    period: 2031-01
    lines_due: 2
    lines_on_time: 1
args:
  first_period: 2031-01
  last_period: 2031-02
raises:
  error: FrameError
  message: supplier performance has a null sup_key or more than one row for a supplier and month
  names:
  - supplier performance
  - sup_key
